<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><title>模拟银行 App</title><style>body{font-family:Arial;background:#eef1f5;padding:30px}.card{max-width:430px;margin:50px auto;background:#fff;padding:25px;border-radius:16px}.amount{font-size:34px;font-weight:bold;margin:18px 0}button{padding:13px;width:48%;border:0;border-radius:8px;font-size:16px}.approve{background:#111;color:#fff}.decline{background:#ddd}input{width:100%;box-sizing:border-box;padding:12px}</style></head><body><div class="card"><h2>模拟银行</h2><p>发现一笔需要持卡人认证的线上交易</p><div class="amount">USD 1,000</div><p>商户：Demo Shop</p><p>卡号：•••• 1111</p><input id="tx" placeholder="输入交易 ID"><div style="display:flex;justify-content:space-between;margin-top:15px"><button class="decline" onclick="decide('decline')">拒绝</button><button class="approve" onclick="decide('approve')">确认</button></div><p id="status">等待 Challenge…</p></div><script>async function decide(decision){const tx=document.getElementById('tx').value.trim();if(!tx){status.innerText='请先输入交易 ID';return}const r=await fetch('/api/challenge',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({transaction_id:tx,decision})});const d=await r.json();document.getElementById('status').innerHTML=`交易：${tx}<br>状态：<b>${d.status}</b>`}</script></body></html>
