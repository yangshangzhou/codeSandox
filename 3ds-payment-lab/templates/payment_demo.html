<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><title>3DS 原理实验</title><style>body{font-family:Arial;background:#f4f6f8;padding:40px}.card{max-width:480px;margin:auto;background:#fff;padding:28px;border-radius:14px}input{width:100%;box-sizing:border-box;padding:12px;margin:7px 0}button{width:100%;padding:13px;margin-top:12px;background:#111;color:#fff;border:0;border-radius:8px}.note{background:#fff4d6;padding:12px;border-radius:8px;font-size:13px}</style></head><body><div class="card"><h2>模拟线上支付</h2><div class="note">安全实验环境，只接受测试卡 <b>4111 1111 1111 1111</b>，不连接真实银行或支付网络。</div><input id="card" value="4111 1111 1111 1111"><input value="12/30"><input value="123" type="password"><button onclick="pay()">支付 USD 1,000</button><p id="result"></p><a href="/bank" target="_blank">打开模拟银行 App →</a></div><script>async function pay(){const r=await fetch('/api/create-payment',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({card_number:document.getElementById('card').value})});const d=await r.json();document.getElementById('result').innerHTML=r.ok?`交易 ID：<b>${d.transaction_id}</b><br>状态：${d.status}<br>请打开模拟银行 App。`:`<b>${d.error}</b>`}</script></body></html>
